[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.openssl",
    "php82Extensions.tokenizer",
    "php82Extensions.fileinfo",
    "php82Extensions.bcmath",
    "php82Extensions.xml",
    "php82Extensions.ctype",
    "php82Extensions.dom",
    "php82Extensions.curl",
    "php82Extensions.intl",
    "php82Extensions.gd",
    "php82Extensions.zip"
]

[phases.install]
cmds = [
    "mkdir -p /opt/storage/framework/{sessions,views,cache}",
    "mkdir -p /opt/storage/logs",
    "mkdir -p /opt/bootstrap/cache",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
    "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"